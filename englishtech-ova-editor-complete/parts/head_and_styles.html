    @media (max-width: 640px) {

      }
      #dockNav {
        width: 100% !important;
        height: 3.25rem !important;
        flex-direction: row !important;
        justify-content: space-around !important;
        padding: 0 0.5rem !important;
        border-right: none !important;
        border-top: 1px solid rgba(148, 163, 184, 0.2) !important;
        z-index: 40 !important;
      }
      #dockNav .dock-btn {
        flex-direction: column !important;
        height: 2.6rem !important;
        width: 3.8rem !important;
        padding: 0.2rem 0 !important;
        gap: 1px !important;
      }
      #dockNav .dock-collapse-wrapper {
        display: none !important;
      }
      #canvaDrawer {
        position: absolute !important;
        top: 0 !important;
        bottom: 3.25rem !important;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        z-index: 35 !important;
        border-right: none !important;
        border-top: 1px solid rgba(148, 163, 184, 0.25) !important;
        box-shadow: 0 -10px 35px -5px rgba(0, 0, 0, 0.7) !important;
        transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease !important;
      }
      #canvaDrawer.is-drawer-closed {
        transform: translateY(115%) !important;
        pointer-events: none !important;
        opacity: 0 !important;
      }
      #canvaDrawer:not(.is-drawer-closed) {
        transform: translateY(0) !important;
        pointer-events: auto !important;
        opacity: 1 !important;
      }
      #drawerBackdrop {
        display: block !important;
      }
      #drawerBackdrop.is-backdrop-hidden {
        display: none !important;
      }
    }

    /* Tablet / Compact Desktop View (641px - 1024px): Left Slim Dock + Overlay Drawer */

        position: relative !important;
        flex-direction: row !important;
      }
      #canvaDrawer {
        position: absolute !important;
        top: 0 !important;
        bottom: 0 !important;

        z-index: 35 !important;
        width: 300px !important;
        max-width: calc(100% - 4rem) !important;
        box-shadow: 10px 0 35px -5px rgba(0, 0, 0, 0.7) !important;
        border-right: 1px solid rgba(148, 163, 184, 0.25) !important;
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease !important;
