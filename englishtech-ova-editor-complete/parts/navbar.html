  <!-- Minimalist Top Navigation (Canva Style) -->
  <header class="h-11 sm:h-14 border-b border-slate-800 bg-slate-900/95 backdrop-blur sticky top-0 z-40 px-2 sm:px-4 flex items-center justify-between gap-1 sm:gap-3 select-none">
    <!-- Left: Brand & Auto-save Status -->
    <div class="flex items-center gap-1.5 sm:gap-2.5 min-w-0 flex-1 sm:flex-initial">
      <div class="hidden xs:flex w-6 h-6 sm:w-8 sm:h-8 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 items-center justify-center text-white font-black text-[10px] sm:text-xs shadow-md shadow-brand-500/25 border border-brand-400/30 shrink-0">
        ET
      </div>
      <div class="flex items-center gap-1 sm:gap-2 min-w-0">
        <input 
          id="projectTitleInput" 
          type="text" 
          value="El número de oro: entre lo divino y lo humano" 
          oninput="updateProjectTitle(this.value)"
          class="text-xs font-bold text-slate-200 hover:text-white bg-transparent hover:bg-slate-800/60 focus:bg-slate-950 border border-transparent hover:border-slate-700 focus:border-brand-500 rounded-lg px-1 sm:px-2 py-0.5 sm:py-1 focus:outline-none transition max-w-[95px] xs:max-w-[140px] sm:max-w-xs md:max-w-sm truncate" 
          title="Clic para cambiar título del OVA"
        />
        <div id="saveStatusIndicator" class="hidden sm:flex items-center gap-1 text-[11px] text-emerald-400 font-medium px-2 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 shrink-0">
          <i data-lucide="check" class="w-3 h-3"></i>
          <span>Guardado</span>
        </div>
      </div>
    </div>

    <!-- Center: View Mode Toggle (Editor Studio vs Student) -->
    <div class="flex items-center gap-1 sm:gap-2 shrink-0">
      <button 
        id="btnUnlockEdit" 
        onclick="showPinUnlockModal()" 
        class="hidden flex items-center gap-1 px-2 sm:px-3 py-1 sm:py-1.5 rounded-xl bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs font-bold transition shadow-xs"
        title="Desbloquear modo edición con PIN de 4 dígitos"
      >
        <i data-lucide="lock" class="w-3.5 h-3.5"></i>
        <span class="hidden xs:inline">Desbloquear</span>
      </button>

      <div id="modeToggleContainer" class="flex items-center bg-slate-950 p-0.5 sm:p-1 rounded-xl border border-slate-800 shadow-inner shrink-0">
        <button 
          id="btnModeEditor" 
          onclick="setAppMode('editor')" 
          class="flex items-center gap-1 sm:gap-1.5 px-2 sm:px-3 py-0.5 sm:py-1.5 rounded-lg text-xs font-bold transition bg-brand-500 text-white shadow-sm"
          title="Modo Editor OVA Studio"
        >
          <i data-lucide="palette" class="w-3.5 h-3.5"></i>
          <span class="hidden xs:inline">Editor</span>
        </button>
        <button 
          id="btnModeViewer" 
          onclick="setAppMode('viewer')" 
          class="flex items-center gap-1 sm:gap-1.5 px-2 sm:px-3 py-0.5 sm:py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white"
          title="Vista Estudiante"
        >
          <i data-lucide="play" class="w-3.5 h-3.5"></i>
          <span class="hidden xs:inline">Ver</span>
        </button>
      </div>
    </div>

    <!-- Right: Unified Actions Menu & Theme -->
    <div class="flex items-center gap-1 sm:gap-2 shrink-0">
      <!-- Fullscreen Toggle -->
      <button 
        id="btnFullScreenToggle" 
        onclick="toggleFullScreen()" 
        title="Pantalla Completa" 
        class="hidden xs:flex w-7 h-7 sm:w-9 sm:h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white items-center justify-center border border-slate-700/80 transition"
      >
        <i data-lucide="maximize-2" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
      </button>

      <!-- Unified Share & Export Dropdown -->
      <div class="relative" id="exportDropdownContainer">
        <button 
          onclick="toggleExportMenu()" 
          class="flex items-center gap-1 sm:gap-1.5 px-2 sm:px-3 py-1 sm:py-1.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold shadow-md shadow-brand-500/25 transition"
          title="Exportar y Compartir"
        >
          <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">Exportar</span>
          <i data-lucide="chevron-down" class="w-3 h-3 opacity-75 hidden sm:inline"></i>
        </button>

        <div id="exportMenu" class="absolute right-0 top-full mt-2 w-60 sm:w-64 bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl p-2 hidden z-50 animate-in fade-in zoom-in-95 duration-150">
          <div class="text-[10px] uppercase font-bold text-slate-500 px-3 py-1 tracking-wider">Compartir & Exportar</div>

          <button onclick="copyShareableLink(); toggleExportMenu();" class="w-full text-left p-2.5 rounded-xl hover:bg-slate-800 flex items-start gap-2.5 transition text-xs group">
            <div class="w-7 h-7 rounded-lg bg-purple-500/20 text-purple-400 flex items-center justify-center shrink-0 border border-purple-500/30 group-hover:bg-purple-500 group-hover:text-white transition">
              <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
            </div>
            <div>
              <div class="font-bold text-slate-200 group-hover:text-white">Copiar Enlace Público</div>
              <div class="text-[11px] text-slate-400">Ver sin cuenta ni inicio de sesión</div>
            </div>
          </button>

          <button onclick="downloadStandaloneHtml(); toggleExportMenu();" class="w-full text-left p-2.5 rounded-xl hover:bg-slate-800 flex items-start gap-2.5 transition text-xs group">
            <div class="w-7 h-7 rounded-lg bg-brand-500/20 text-brand-400 flex items-center justify-center shrink-0 border border-brand-500/30 group-hover:bg-brand-500 group-hover:text-white transition">
              <i data-lucide="download-cloud" class="w-3.5 h-3.5"></i>
            </div>
            <div>
              <div class="font-bold text-slate-200 group-hover:text-white">Descargar OVA Web</div>
              <div class="text-[11px] text-slate-400">Archivo HTML único y autónomo</div>
            </div>
          </button>

          <button onclick="exportScormZip(); toggleExportMenu();" class="w-full text-left p-2.5 rounded-xl hover:bg-slate-800 flex items-start gap-2.5 transition text-xs group">
            <div class="w-7 h-7 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center shrink-0 border border-emerald-500/30 group-hover:bg-emerald-500 group-hover:text-white transition">
              <i data-lucide="archive" class="w-3.5 h-3.5"></i>
            </div>
            <div>
              <div class="font-bold text-slate-200 group-hover:text-white">Paquete SCORM 1.2 (.zip)</div>
              <div class="text-[11px] text-slate-400">Para Moodle, Blackboard, Canvas</div>
            </div>
          </button>

          <button onclick="openIntegrateModal(); toggleExportMenu();" class="w-full text-left p-2.5 rounded-xl hover:bg-slate-800 flex items-start gap-2.5 transition text-xs group">
            <div class="w-7 h-7 rounded-lg bg-blue-500/20 text-blue-400 flex items-center justify-center shrink-0 border border-blue-500/30 group-hover:bg-blue-500 group-hover:text-white transition">
              <i data-lucide="code-2" class="w-3.5 h-3.5"></i>
            </div>
            <div>
              <div class="font-bold text-slate-200 group-hover:text-white">Implantar en EnglishTech</div>
              <div class="text-[11px] text-slate-400">Componente React + Guía</div>
            </div>
          </button>

          <div class="my-1.5 border-t border-slate-800"></div>

          <button onclick="exportProjectJson(); toggleExportMenu();" class="w-full text-left p-2 rounded-lg hover:bg-slate-800 flex items-center gap-2 text-xs text-slate-300 hover:text-white transition">
            <i data-lucide="file-json" class="w-3.5 h-3.5 text-amber-400"></i>
            <span>Guardar Proyecto (JSON)</span>
          </button>

          <label class="w-full text-left p-2 rounded-lg hover:bg-slate-800 flex items-center gap-2 text-xs text-slate-300 hover:text-white transition cursor-pointer">
            <i data-lucide="upload" class="w-3.5 h-3.5 text-emerald-400"></i>
            <span>Cargar Proyecto (JSON)</span>
            <input type="file" accept=".json" onchange="importProjectJson(event); toggleExportMenu();" class="hidden" />
          </label>

          <button onclick="loadTemplateOva(); toggleExportMenu();" class="w-full text-left p-2 rounded-lg hover:bg-slate-800 flex items-center gap-2 text-xs text-slate-400 hover:text-slate-200 transition">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 text-slate-500"></i>
            <span>Restablecer Plantilla CIER</span>
          </button>
        </div>
      </div>

      <!-- Theme Switcher -->
      <button 
        id="themeToggleBtn" 
        onclick="toggleTheme()" 
        title="Cambiar tema claro / oscuro" 
        class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white flex items-center justify-center border border-slate-700/80 transition"
      >
        <i data-lucide="sun" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
      </button>
    </div>
  </header>
