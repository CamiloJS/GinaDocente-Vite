  <!-- Toast Notification Container (Canva style) -->
  <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Custom Confirmation Dialog (Replaces native window.confirm) -->
  <div id="customConfirmModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-700/80 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 animate-in fade-in zoom-in-95 duration-200">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-rose-500/10 text-rose-400 flex items-center justify-center border border-rose-500/20 shrink-0">
          <i data-lucide="alert-triangle" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 id="confirmModalTitle" class="text-sm font-bold text-white">¿Estás seguro?</h3>
          <p id="confirmModalDesc" class="text-xs text-slate-400 mt-0.5">Esta acción no se puede deshacer.</p>
        </div>
      </div>
      <div class="flex justify-end gap-2.5 pt-2 border-t border-slate-800">
        <button id="btnConfirmCancel" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 transition">
          Cancelar
        </button>
        <button id="btnConfirmOk" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-xs font-semibold text-white shadow-lg shadow-rose-600/20 transition">
          Confirmar
        </button>
      </div>
    </div>
  </div>

  <!-- Custom Input Dialog (Replaces native window.prompt) -->
  <div id="customPromptModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-700/80 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 animate-in fade-in zoom-in-95 duration-200">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-brand-500/10 text-brand-400 flex items-center justify-center border border-brand-500/20 shrink-0">
          <i data-lucide="edit-3" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 id="promptModalTitle" class="text-sm font-bold text-white">Nueva Sección</h3>
          <p id="promptModalDesc" class="text-xs text-slate-400 mt-0.5">Escribe el título para esta sección del OVA.</p>
        </div>
      </div>
      <input id="promptModalInput" type="text" class="w-full text-xs bg-slate-950 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-brand-500" placeholder="Título de la sección..." />
      <div class="flex justify-end gap-2.5 pt-2 border-t border-slate-800">
        <button id="btnPromptCancel" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 transition">
          Cancelar
        </button>
        <button id="btnPromptOk" class="px-4 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-xs font-semibold text-white shadow-lg shadow-brand-500/25 transition">
          Guardar
        </button>
      </div>
    </div>
  </div>

  <!-- Custom PIN Unlock Modal (4 digits) -->
  <div id="customPinModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-700/80 rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4 animate-in fade-in zoom-in-95 duration-200 text-center">
      <div class="mx-auto w-12 h-12 rounded-2xl bg-amber-500/10 text-amber-400 flex items-center justify-center border border-amber-500/20">
        <i data-lucide="lock" class="w-6 h-6"></i>
      </div>
      <div>
        <h3 class="text-sm font-bold text-white">Desbloquear Edición</h3>
        <p class="text-xs text-slate-400 mt-1">Ingresa el código PIN de 4 dígitos configurado por la docente para desbloquear la edición de este OVA.</p>
      </div>
      <div class="flex justify-center my-3">
        <input 
          id="pinModalInput" 
          type="password" 
          inputmode="numeric" 
          maxlength="4" 
          pattern="[0-9]*"
          class="w-40 text-center text-2xl tracking-[0.4em] font-mono font-bold bg-slate-950 border border-slate-700 rounded-xl py-2.5 text-white focus:outline-none focus:border-brand-500 transition shadow-inner" 
          placeholder="••••" 
          autocomplete="off"
        />
      </div>
      <p id="pinModalError" class="text-[11px] text-rose-400 hidden font-medium">Código PIN incorrecto (4 dígitos). Inténtalo de nuevo.</p>
      <div class="flex justify-center gap-2 pt-2 border-t border-slate-800">
        <button id="btnPinCancel" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 transition">
          Cancelar
        </button>
        <button id="btnPinSubmit" class="px-5 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-xs font-bold text-white shadow-lg shadow-brand-500/25 transition">
          Desbloquear
        </button>
      </div>
    </div>
  </div>
