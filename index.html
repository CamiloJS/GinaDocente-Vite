    <!-- Control de Versión Estricto y Limpieza de Caché -->
    <script>
      (function() {
        var buildId = "__BUILD_TIMESTAMP__";
        window.__CURRENT_BUILD_ID__ = buildId;

        // Desregistrar cualquier Service Worker antiguo
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          }).catch(function() {});
        }
        // Limpiar Cache Storage obsoleto
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (var j = 0; j < keys.length; j++) {
              caches.delete(keys[j]);
            }
          }).catch(function() {});
        }
        // Si el navegador cargó desde bfcache (Back/Forward Cache), forzar recarga fresca
        window.addEventListener('pageshow', function(event) {
          if (event.persisted) {
            window.location.replace(window.location.pathname + '?_t=' + Date.now() + window.location.hash);
          }
        });

        // Comprobación de versión ultra-rápida contra el servidor
        try {
          fetch('/version.json?_t=' + Date.now(), { cache: 'no-store' })
            .then(function(res) { return res.json(); })
            .then(function(data) {
              if (data && data.version && String(data.version) !== String(buildId)) {
                var freshUrl = window.location.pathname + '?_v=' + data.version + '&_ts=' + Date.now() + window.location.hash;
                window.location.replace(freshUrl);
              } else {
                if (window.location.search.indexOf('_v=') !== -1 || window.location.search.indexOf('_fresh=') !== -1 || window.location.search.indexOf('r=') !== -1 || window.location.search.indexOf('_ts=') !== -1) {
                  setTimeout(function() {
                    try {
                      window.history.replaceState({}, document.title, window.location.pathname + window.location.hash);
                    } catch (e) {}
                  }, 1200);
                }
              }
            }).catch(function() {});
        } catch (err) {}
      })();
    </script>

    <!-- Tema oscuro/claro antes de montar React para evitar flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('englishTech_theme');
          var isDark = saved === 'dim' || saved === 'lights_out' || saved === 'dark' ||
            (saved === null && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            if (saved === 'lights_out' || saved === 'dark') {
              document.documentElement.classList.add('theme-lights-out');
            } else if (saved === 'dim') {
              document.documentElement.classList.add('theme-dim');
            }
          }
        } catch (e) {}
      })();
    </script>
