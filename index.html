    <link rel="manifest" href="/manifest.json" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="English TECH" />
    <link rel="apple-touch-icon" href="/icono.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="English TECH - Universidad de Pamplona" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('englishTech_theme');
          var isDark = saved === 'dim' || saved === 'lights_out' || saved === 'dark' || (saved === null && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            if (saved === 'lights_out' || saved === 'dark') {
              document.documentElement.classList.add('theme-lights-out');
            } else if (saved === 'dim') {
              document.documentElement.classList.add('theme-dim');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
